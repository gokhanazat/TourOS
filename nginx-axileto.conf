server {
    listen 80;
    server_name axileto.com www.axileto.com;
    return 301 https://$host$request_uri;
}

server {
    listen 443 ssl http2;
    server_name axileto.com www.axileto.com;

    ssl_certificate /etc/letsencrypt/live/axileto.com/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/axileto.com/privkey.pem;
    include /etc/letsencrypt/options-ssl-nginx.conf;
    ssl_dhparam /etc/letsencrypt/ssl-dhparams.pem;

    root /var/www/axileto.com;
    index index.html;

    # Gzip Compression Optimization (WASM, JS, CSS, JSON)
    gzip on;
    gzip_vary on;
    gzip_proxied any;
    gzip_comp_level 6;
    gzip_min_length 256;
    gzip_types
        text/plain
        text/css
        text/xml
        text/javascript
        application/javascript
        application/x-javascript
        application/json
        application/xml
        application/rss+xml
        application/atom+xml
        image/svg+xml
        application/wasm;

    types {
        text/html                             html htm shtml;
        text/css                              css;
        text/xml                              xml;
        image/gif                             gif;
        image/jpeg                            jpeg jpg;
        application/javascript                js;
        application/atom+xml                  atom;
        application/rss+xml                   rss;
        application/wasm                      wasm;
        image/png                             png;
        image/svg+xml                         svg svgz;
        image/webp                            webp;
        font/woff                             woff;
        font/woff2                            woff2;
        application/json                      json;
    }

    location / {
        try_files $uri $uri/ /index.html;
    }

    location ~* \.wasm$ {
        expires 30d;
        add_header Cache-Control "public, max-age=2592000, immutable";
    }

    location ~* \.(js|css|png|jpg|jpeg|gif|ico|svg|woff|woff2)$ {
        expires 7d;
        add_header Cache-Control "public, no-transform";
    }
}
