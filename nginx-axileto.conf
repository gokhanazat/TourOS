server {
    listen 80;
    server_name axileto.com www.axileto.com;
    return 301 https://$host$request_uri;
}

server {
    listen 443 ssl http2;
    server_name axileto.com www.axileto.com;

    ssl_certificate /etc/letsencrypt/live/axileto.com/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/axileto.com/privkey.pem;
    include /etc/letsencrypt/options-ssl-nginx.conf;
    ssl_dhparam /etc/letsencrypt/ssl-dhparams.pem;

    root /var/www/axileto.com;
    index index.html;

    # Gzip Compression
    gzip on;
    gzip_vary on;
    gzip_proxied any;
    gzip_comp_level 6;
    gzip_min_length 256;
    gzip_types
        text/plain
        text/css
        text/xml
        text/javascript
        application/javascript
        application/x-javascript
        application/json
        application/xml
        application/rss+xml
        application/atom+xml
        image/svg+xml
        application/wasm;

    types {
        text/html                             html htm shtml;
        text/css                              css;
        text/xml                              xml;
        image/gif                             gif;
        image/jpeg                            jpeg jpg;
        application/javascript                js;
        application/atom+xml                  atom;
        application/rss+xml                   rss;
        application/wasm                      wasm;
        image/png                             png;
        image/svg+xml                         svg svgz;
        image/webp                            webp;
        font/woff                             woff;
        font/woff2                            woff2;
        application/json                      json;
    }

    # NEVER cache index.html or webApp.js so new deploys are instantly picked up
    location = / {
        try_files /index.html =404;
        add_header Cache-Control "no-store, no-cache, must-revalidate, proxy-revalidate, max-age=0";
    }

    location = /index.html {
        add_header Cache-Control "no-store, no-cache, must-revalidate, proxy-revalidate, max-age=0";
    }

    location ~* \.js$ {
        add_header Cache-Control "no-store, no-cache, must-revalidate, proxy-revalidate, max-age=0";
    }

    location ~* \.wasm$ {
        expires 7d;
        add_header Cache-Control "public, max-age=604800";
    }

    location ~* \.(css|png|jpg|jpeg|gif|ico|svg|woff|woff2)$ {
        expires 7d;
        add_header Cache-Control "public, no-transform";
    }

    # YandexGPT Proxy - API Anahtarı sunucuda korunur, istemci koduna sızmaz
    location /api/yandex-gpt {
        if ($request_method = 'OPTIONS') {
            add_header 'Access-Control-Allow-Origin' '*' always;
            add_header 'Access-Control-Allow-Methods' 'GET, POST, OPTIONS' always;
            add_header 'Access-Control-Allow-Headers' 'Authorization, Content-Type, x-folder-id' always;
            add_header 'Access-Control-Max-Age' 86400;
            add_header 'Content-Length' 0;
            add_header 'Content-Type' 'text/plain charset=UTF-8';
            return 204;
        }
        add_header 'Access-Control-Allow-Origin' '*' always;
        add_header 'Access-Control-Allow-Methods' 'GET, POST, OPTIONS' always;
        add_header 'Access-Control-Allow-Headers' 'Authorization, Content-Type, x-folder-id' always;

        proxy_pass https://llm.api.cloud.yandex.net/foundationModels/v1/completion;
        proxy_http_version 1.1;
        # Yandex Cloud Konsolundan uretilecek yeni API anahtarini asagiya yaziniz:
        proxy_set_header Authorization "Api-Key YANDEX_API_KEY_BURAYA";
        proxy_set_header x-folder-id "b1guqqj8nrc72tvmj6un";
        proxy_set_header Host llm.api.cloud.yandex.net;
        proxy_set_header Content-Type "application/json";
        proxy_ssl_server_name on;
    }

    location /downloads/ {
        alias /var/www/axileto.com/downloads/;
        autoindex off;
        add_header Content-Disposition "attachment";
        add_header Cache-Control "public, max-age=86400";
    }

    location / {
        try_files $uri $uri/ /index.html;
    }
}
