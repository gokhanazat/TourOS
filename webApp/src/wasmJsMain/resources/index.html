<!DOCTYPE html>
<html lang="tr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Axileto - Tur & Seyahat Operasyonları Platformu</title>
    <link rel="preconnect" href="https://images.unsplash.com" crossorigin>
    <link rel="preconnect" href="https://fonts.googleapis.com" crossorigin>
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link rel="dns-prefetch" href="https://supabase.co">
    <link rel="preload" href="webApp.js" as="script">
    <link type="text/css" rel="stylesheet" href="styles.css">
</head>
<body style="margin: 0; padding: 0; width: 100vw; height: 100vh; overflow: hidden; background-color: #0F172A;">
    <div id="loader-screen">
        <div class="loader-content">
            <div class="loader-logo-wrapper">
                <img src="logo.png" class="loader-logo" alt="Axileto Logo">
            </div>
            <div class="loader-brand">
                <span class="brand-axileto">axileto</span>
            </div>
            <div class="loader-subtitle">Туристическая платформа</div>
            <div class="loader-bar">
                <div class="loader-progress"></div>
            </div>
        </div>
    </div>
    <script type="application/javascript" src="webApp.js"></script>
</body>
</html>
