<!DOCTYPE html>
<html lang="tr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <meta http-equiv="Cache-Control" content="no-cache, no-store, must-revalidate">
    <meta http-equiv="Pragma" content="no-cache">
    <meta http-equiv="Expires" content="0">
    <title>Axileto - Tur & Seyahat Operasyonları Platformu</title>
    <link rel="preconnect" href="https://images.unsplash.com" crossorigin>
    <link rel="preconnect" href="https://fonts.googleapis.com" crossorigin>
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link rel="dns-prefetch" href="https://supabase.co">
    <link type="text/css" rel="stylesheet" href="styles.css">
    <style>
        html.whitelabel-mode .loader-logo-wrapper { display: none !important; }
    </style>
    <script type="text/javascript">
        try {
            var urlParams = new URLSearchParams(window.location.search);
            var ref = urlParams.get('agency') || urlParams.get('ref') || urlParams.get('b2b');
            if (ref && ref.trim().length > 0) {
                sessionStorage.setItem('touros_agency_ref', ref.trim());
                try {
                    window.history.replaceState({}, document.title, window.location.pathname);
                } catch(e) {}
            }
            var saved = sessionStorage.getItem('touros_agency_ref');
            var host = window.location.hostname.toLowerCase();
            var isCustomDomain = host && host !== 'axileto.com' && host !== 'www.axileto.com' && host !== 'localhost' && host !== '127.0.0.1';

            if (ref || saved || isCustomDomain || window.location.pathname.indexOf('/a/') !== -1) {
                document.documentElement.classList.add('whitelabel-mode');
                document.title = 'Online Rezervasyon Portalı';
                var hideBranding = function() {
                    var logo = document.querySelector('.loader-logo-wrapper');
                    if (logo) logo.style.display = 'none';
                    var brand = document.querySelector('.brand-axileto');
                    if (brand) brand.textContent = 'Online Rezervasyon';
                    var sub = document.querySelector('.loader-subtitle');
                    if (sub) sub.textContent = 'Rezervasyon Portalı Yükleniyor...';
                };
                if (document.readyState === 'loading') {
                    document.addEventListener('DOMContentLoaded', hideBranding);
                } else {
                    hideBranding();
                }
            }
        } catch(e) {}
    </script>

</head>
<body style="margin: 0; padding: 0; width: 100vw; height: 100vh; overflow: hidden; background-color: #0F172A;">
    <div id="loader-screen">
        <div class="loader-content">
            <div class="loader-logo-wrapper">
                <img src="logo.png" class="loader-logo" alt="Axileto Logo">
            </div>
            <div class="loader-brand">
                <span class="brand-axileto">axileto</span>
            </div>
            <div class="loader-subtitle">Туристическая платформа</div>
            <div class="loader-bar">
                <div class="loader-progress"></div>
            </div>
        </div>
    </div>
    <script type="application/javascript" src="webApp.js?v=20260825_6"></script>
</body>
</html>
