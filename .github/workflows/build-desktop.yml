name: Build & Release Desktop (Windows EXE / MSI)

on:
  workflow_dispatch:
    inputs:
      version_tag:
        description: 'Sürüm Etiketi (Örn: v1.0.0)'
        required: false
        default: 'v1.0.0'

permissions:
  contents: write

jobs:
  build-desktop:
    name: Build Windows Desktop App
    runs-on: windows-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v5
        with:
          distribution: 'temurin'
          java-version: '17'

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v4

      - name: Build Desktop Native Distribution
        run: ./gradlew :desktopApp:packageDistributionForCurrentOS --no-daemon

      - name: Locate Installers
        id: locate_dist
        shell: pwsh
        run: |
          Get-ChildItem -Path desktopApp/build/compose/binaries -Recurse | Select-Object FullName

      - name: Upload Desktop Artifacts
        uses: actions/upload-artifact@v4
        with:
          name: TourOS-Desktop-Windows
          path: desktopApp/build/compose/binaries/main/
          retention-days: 14

      - name: Create or Update GitHub Release
        uses: softprops/action-gh-release@v2
        if: startsWith(github.ref, 'refs/tags/') || github.event_name == 'workflow_dispatch'
        with:
          tag_name: ${{ github.event.inputs.version_tag || 'latest-desktop' }}
          name: "TourOS Desktop ${{ github.event.inputs.version_tag || 'Latest' }}"
          draft: false
          prerelease: false
          files: |
            desktopApp/build/compose/binaries/main/msi/*.msi
            desktopApp/build/compose/binaries/main/exe/*.exe
            desktopApp/build/compose/binaries/main/app/*
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
