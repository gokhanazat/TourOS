name: Regression & Unit Tests

on:
  push:
    branches:
      - main
      - master
  pull_request:
    branches:
      - main
      - master
  workflow_dispatch:

jobs:
  run-regression-tests:
    name: Run Kotlin Multiplatform Regression Tests
    runs-on: ubuntu-latest

    permissions:
      contents: read
      checks: write
      pull-requests: write

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'
          cache: 'gradle'

      - name: Make gradlew executable
        run: chmod +x gradlew

      - name: Gitleaks Scanner
        uses: gitleaks/gitleaks-action@v2
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: Run Regression & Unit Tests
        run: ./gradlew test --no-daemon

      - name: Run i18n Translation Integrity Tests
        run: ./gradlew :shared:jvmTest --tests "com.mgacreative.touros.ui.localization.I18nTranslationKeysTest" --no-daemon

      - name: Run Live Operator Integration Tests (Tourvisor REST & Samo SOAP)
        env:
          TOURVISOR_API_URL: ${{ secrets.TOURVISOR_API_URL || 'http://tourvisor.ru/xml/list.php' }}
          TOURVISOR_AUTH_LOGIN: ${{ secrets.TOURVISOR_AUTH_LOGIN || 'Mabit23@gmail.com' }}
          TOURVISOR_AUTH_PASS: ${{ secrets.TOURVISOR_AUTH_PASS || 'FFytMvSU0ZHr' }}
          SAMO_SOAP_ENDPOINT: ${{ secrets.SAMO_SOAP_ENDPOINT || 'https://samo.ru' }}
          SAMO_AUTH_USER: ${{ secrets.SAMO_AUTH_USER || 'Mabit23@gmail.com' }}
          SAMO_AUTH_PASS: ${{ secrets.SAMO_AUTH_PASS || 'FFytMvSU0ZHr' }}
        run: ./gradlew :shared:jvmTest --tests "com.mgacreative.touros.integration.OperatorLiveIntegrationTest" --no-daemon

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Install Playwright Browsers
        run: npx playwright install --with-deps chromium

      - name: Run Playwright E2E Booking Flow Tests
        env:
          PLAYWRIGHT_BASE_URL: ${{ secrets.PLAYWRIGHT_BASE_URL || 'https://axileto.com' }}
        run: npm run test:e2e

      - name: Static Code Analysis (Ktlint Check)
        uses: ScaCap/action-ktlint@master
        with:
          github_token: ${{ secrets.GITHUB_TOKEN }}
          reporter: github-pr-check

      - name: Upload Test Results
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: test-results
          path: |
            **/build/reports/tests/
            **/build/test-results/

  validate-database-migrations:
    name: Validate Database Migrations (Static Analysis)
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install SQLFluff
        run: pip install sqlfluff

      - name: Make validation script executable
        run: chmod +x database/validate-migrations.sh

      - name: Validate Changed Migrations (SQLFluff Postgres Dialect)
        run: ./database/validate-migrations.sh
